# ============================================================
# Secret Scanning — oracle-ai-mcp-server
# Especial atención a tokens de GitHub PAT y connection strings
# ============================================================
name: 🔐 Secret Scanning

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks — Detectar Secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --verbose --redact

  config-validation:
    name: Validar Archivos de Configuración MCP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar que configs no tengan tokens reales
        run: |
          echo "🔍 Escaneando archivos JSON de configuración MCP..."
          # Buscar GitHub PAT tokens reales (ghp_xxxx o github_pat_xxxx)
          FOUND=$(grep -rn 'ghp_\|github_pat_\|ghs_\|gho_' \
            --include="*.json" --include="*.yml" --include="*.yaml" \
            --include="*.ps1" --include="*.sh" . || true)
          if [ -n "$FOUND" ]; then
            echo "❌ ERROR: Posibles tokens de GitHub encontrados:"
            echo "$FOUND" | sed 's/ghp_[A-Za-z0-9]*/ghp_[REDACTED]/g'
            exit 1
          fi

          # Buscar connection strings de Oracle con passwords reales
          FOUND=$(grep -rn 'password.*=.*"[A-Za-z0-9]' \
            --include="*.json" --include="*.ps1" . \
            | grep -v 'TU_' | grep -v 'REEMPLAZA' | grep -v 'example' || true)
          if [ -n "$FOUND" ]; then
            echo "❌ ERROR: Posibles passwords en configuración:"
            echo "$FOUND" | sed 's/password.*=.*/password = [REDACTED]/'
            exit 1
          fi

          echo "✅ No se encontraron credenciales en configuraciones MCP."
